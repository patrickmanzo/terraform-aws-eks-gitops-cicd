server:
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

configs:
  secret:
    argocdServerAdminPassword: "${admin_password}"

  params:
    server.insecure: true
    # Don't set basehref/rootpath - causes redirect loops with ALB

  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, applications, action/*, */*, allow
      p, role:admin, applications, exec, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, exec, create, */*, allow
      g, admin, role:admin

global:
  domain: ""

# Disable Redis completely (not needed for small/lab environments)
# ArgoCD will work without caching - just slower performance
redis-ha:
  enabled: false

redis:
  enabled: false

externalRedis:
  enabled: false
